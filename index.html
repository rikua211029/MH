<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MUSIC HORN</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        font-family: "Segoe UI", sans-serif;
        color: #ffffff;
        background:
            radial-gradient(circle at top, #173c69 0%, #071629 55%, #030914 100%);
    }

    .container {
        width: 100%;
        max-width: 700px;
        padding: 35px;
        text-align: center;
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 255, 255, 0.13);
        border-radius: 24px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(12px);
    }

    h1 {
        margin: 0 0 12px;
        font-size: clamp(28px, 6vw, 42px);
        letter-spacing: 2px;
    }

    .subtitle {
        margin-bottom: 26px;
        color: #b8cbe3;
        font-size: 14px;
    }

    .status {
        margin-bottom: 25px;
        padding: 12px;
        border-radius: 12px;
        background: rgba(0, 0, 0, 0.2);
        color: #a9c2df;
        font-weight: 600;
    }

    .status.playing {
        color: #66e6ff;
    }

    .status.locked {
        color: #ffce79;
    }

    .buttons {
        display: flex;
        flex-direction: column;
        gap: 16px;
    }

    .horn-button {
        width: 100%;
        min-height: 100px;
        padding: 20px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 18px;
        background: linear-gradient(135deg, #1685ed, #0752b5);
        color: white;
        font-size: 21px;
        font-weight: 700;
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
        transition: filter 0.12s, transform 0.12s, opacity 0.12s;
    }

    .horn-button.secondary {
        background: linear-gradient(135deg, #7858e8, #4930a9);
    }

    .horn-button:active,
    .horn-button.active {
        filter: brightness(1.2);
        transform: scale(0.985);
    }

    .horn-button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
        transform: none;
        filter: none;
    }

    .button-title {
        display: block;
    }

    .key-hint {
        display: block;
        margin-top: 8px;
        font-size: 13px;
        font-weight: 500;
        opacity: 0.85;
    }

    .help {
        margin-top: 22px;
        color: #a9bfd8;
        font-size: 13px;
        line-height: 1.8;
    }

    @media (max-width: 480px) {
        .container {
            padding: 24px 18px;
        }

        .horn-button {
            min-height: 90px;
            font-size: 18px;
        }
    }
</style>
</head>

<body>
<div class="container">
    <h1>MUSIC HORN</h1>
    <div class="subtitle">PRESS AND HOLD</div>

    <div id="status" class="status">READY</div>

    <div class="buttons">
        <button id="horn1Button" class="horn-button" type="button">
            <span class="button-title">メロディ</span>
            <span class="key-hint">Backspace</span>
        </button>

        <button id="horn2Button" class="horn-button secondary" type="button">
            <span class="button-title">空気</span>
            <span class="key-hint">B</span>
        </button>
    </div>

    <div class="help">
        ボタンまたは対応するキーを押している間、ホーンが鳴ります。<br>
    </div>
</div>

<script>
"use strict";

const SOUND_PATHS = {
    horn1: "sounds/horn.mp3",
    horn2: "sounds/horn2.mp3",
    end: "sounds/end.mp3"
};

const statusElement = document.getElementById("status");
const horn1Button = document.getElementById("horn1Button");
const horn2Button = document.getElementById("horn2Button");

let audioContext = null;
let audioBuffers = {};
let loadPromise = null;

const horns = {
    horn1: { pressed: false, source: null },
    horn2: { pressed: false, source: null }
};

const heldKeys = new Set();
let endSources = new Set();

function getAudioContext() {
    if (!audioContext) {
        const AudioContextClass =
            window.AudioContext || window.webkitAudioContext;

        audioContext = new AudioContextClass({
            latencyHint: "interactive"
        });
    }

    return audioContext;
}

function preloadSounds() {
    if (loadPromise) return loadPromise;

    loadPromise = (async () => {
        const context = getAudioContext();

        const entries = await Promise.all(
            Object.entries(SOUND_PATHS).map(async ([name, path]) => {
                const response = await fetch(path);

                if (!response.ok) {
                    throw new Error("音声ファイルが見つかりません: " + path);
                }

                const data = await response.arrayBuffer();
                return [name, await context.decodeAudioData(data)];
            })
        );

        audioBuffers = Object.fromEntries(entries);
    })();

    loadPromise.catch(error => {
        console.error(error);
        loadPromise = null;
        updateStatus("音声ファイルを確認してください");
    });

    return loadPromise;
}

function updateStatus(message = null) {
    if (message) {
        statusElement.textContent = message;
        statusElement.classList.remove("playing", "locked");
        return;
    }

    const one = horns.horn1.pressed;
    const two = horns.horn2.pressed;

    statusElement.classList.remove("locked", "playing");

    if (one && two) {
        statusElement.textContent = "● 両方のホーン 吹鳴中";
        statusElement.classList.add("playing");
    } else if (one) {
        statusElement.textContent = "● メロディ 吹鳴中";
        statusElement.classList.add("playing");
    } else if (two) {
        statusElement.textContent = "● 空気 吹鳴中";
        statusElement.classList.add("playing");
    } else {
        statusElement.textContent = "READY";
    }
}

async function startHorn(type) {
    const horn = horns[type];

    if (horn.pressed) return;

    horn.pressed = true;
    const button = type === "horn1" ? horn1Button : horn2Button;
    button.classList.add("active");
    updateStatus();

    try {
        const context = getAudioContext();

        await preloadSounds();

        if (!horn.pressed) return;

        if (context.state !== "running") {
            await context.resume();
        }

        if (!horn.pressed) return;

        const source = context.createBufferSource();
        source.buffer = audioBuffers[type];
        source.connect(context.destination);

        horn.source = source;

        source.onended = () => {
            if (horn.source === source) horn.source = null;
            try { source.disconnect(); } catch (_) {}
        };

        source.start(0);
    } catch (error) {
        console.error(error);
        stopHorn(type);
        updateStatus("音声を再生できませんでした");
    }
}

function stopHorn(type) {
    const horn = horns[type];

    if (!horn.pressed) return;

    horn.pressed = false;

    const button = type === "horn1" ? horn1Button : horn2Button;
    button.classList.remove("active");

    if (horn.source) {
        const source = horn.source;
        horn.source = null;
        source.onended = null;

        try { source.stop(); } catch (_) {}
        try { source.disconnect(); } catch (_) {}
    }

    updateStatus();

    if (type === "horn2") {
        playEndSound();
    }
}

async function playEndSound() {
    try {
        const context = getAudioContext();

        await preloadSounds();

        if (context.state !== "running") {
            await context.resume();
        }

        const source = context.createBufferSource();
        source.buffer = audioBuffers.end;
        source.connect(context.destination);

        endSources.add(source);

        source.onended = () => {
            endSources.delete(source);
            try { source.disconnect(); } catch (_) {}
            updateStatus();
        };

        source.start(0);
        updateStatus();
    } catch (error) {
        console.error(error);
        updateStatus("終了音を読み込めませんでした");
    }
}

function setupButton(button, type) {
    button.addEventListener("pointerdown", event => {
        event.preventDefault();

        try {
            button.setPointerCapture(event.pointerId);
        } catch (_) {}

        startHorn(type);
    });

    const release = event => {
        if (event) event.preventDefault();
        stopHorn(type);
    };

    button.addEventListener("pointerup", release);
    button.addEventListener("pointercancel", release);
    button.addEventListener("lostpointercapture", release);
}

window.addEventListener("pointerup", () => {
    for (const type of Object.keys(horns)) {
        stopHorn(type);
    }
});

window.addEventListener("blur", () => {
    for (const type of Object.keys(horns)) {
        stopHorn(type);
    }
    heldKeys.clear();
});

function isTypingTarget(target) {
    return target instanceof HTMLElement &&
        (target.isContentEditable ||
         ["INPUT", "TEXTAREA", "SELECT"].includes(target.tagName));
}

window.addEventListener("keydown", event => {
    if (isTypingTarget(event.target)) return;

    let type = null;

    if (event.code === "Backspace") {
        type = "horn1";
        event.preventDefault();
    } else if (event.code === "KeyB") {
        type = "horn2";
    }

    if (!type || event.repeat || heldKeys.has(event.code)) return;

    heldKeys.add(event.code);
    startHorn(type);
});

window.addEventListener("keyup", event => {
    let type = null;

    if (event.code === "Backspace") {
        type = "horn1";
        event.preventDefault();
    } else if (event.code === "KeyB") {
        type = "horn2";
    }

    if (!type) return;

    heldKeys.delete(event.code);
    stopHorn(type);
});

setupButton(horn1Button, "horn1");
setupButton(horn2Button, "horn2");

window.addEventListener("load", () => {
    preloadSounds().catch(console.error);
});
</script>
</body>
</html>
