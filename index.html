<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Music Horn</title>


<style>

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    min-height: 100vh;

    font-family:
        "Yu Gothic",
        "Meiryo",
        sans-serif;

    color: white;

    background:
        radial-gradient(
            circle at top,
            #263e52,
            #111b25 45%,
            #05080c
        );

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 20px;

}


/* ==========================================
   メイン
========================================== */

.app {

    width: 100%;

    max-width: 700px;

    background:
        rgba(255,255,255,.07);

    border:
        1px solid
        rgba(255,255,255,.15);

    border-radius: 25px;

    padding: 35px;

    backdrop-filter:
        blur(18px);

    box-shadow:
        0 25px 80px
        rgba(0,0,0,.55);

    text-align: center;

}


/* ==========================================
   タイトル
========================================== */

h1 {

    margin:
        0 0 30px;

    font-size: 30px;

    letter-spacing: 3px;

}


/* ==========================================
   ステータス
========================================== */

.status {

    margin-bottom: 20px;

    color: #8997a3;

    font-size: 14px;

}

.status.playing {

    color: #62ddff;

}


/* ==========================================
   ボタン
========================================== */

.horn-button {

    width: 100%;

    min-height: 160px;

    border: none;

    border-radius: 25px;

    cursor: pointer;

    color: white;

    font-size: 28px;

    font-weight: bold;

    letter-spacing: 3px;

    background:
        linear-gradient(
            145deg,
            #1596c7,
            #075678
        );

    box-shadow:

        0 12px 35px
        rgba(0,0,0,.4),

        inset 0 1px
        rgba(255,255,255,.2);

    transition:
        transform .08s,
        filter .08s,
        background .08s;

    user-select: none;

    -webkit-user-select: none;

    -webkit-touch-callout: none;

    touch-action: none;

}


.horn-button:hover {

    filter:
        brightness(1.1);

}


.horn-button:active,
.horn-button.pressed {

    transform:
        scale(.97);

    background:
        linear-gradient(
            145deg,
            #20bde8,
            #087795
        );

    box-shadow:

        0 0 45px
        rgba(40,210,255,.4),

        inset 0 2px
        rgba(255,255,255,.2);

}


/* ==========================================
   スマホ
========================================== */

@media(max-width:600px) {

    .app {

        padding: 20px;

    }

    h1 {

        font-size: 24px;

    }

    .horn-button {

        min-height: 130px;

        font-size: 21px;

    }

}

</style>

</head>


<body>


<div class="app">


    <h1>
        🚆 MUSIC HORN
    </h1>


    <div
        class="status"
        id="status"
    >
        READY
    </div>


    <button
        class="horn-button"
        id="hornButton"
    >
        📯 押している間だけ吹鳴
    </button>


</div>


<script>


/* ==========================================
   設定
========================================== */

const SOUND_FILE =
    "sounds/horn.mp3";


/* ==========================================
   Web Audio
========================================== */

let audioContext = null;

let audioBuffer = null;

let sourceNode = null;

let isPressed = false;


/* ==========================================
   HTML要素
========================================== */

const button =
    document.getElementById(
        "hornButton"
    );

const status =
    document.getElementById(
        "status"
    );


/* ==========================================
   AudioContext準備
========================================== */

function getAudioContext() {

    if (!audioContext) {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }

    return audioContext;

}


/* ==========================================
   音声ファイルをメモリへ読み込む
========================================== */

async function loadSound() {

    if (audioBuffer) {

        return true;

    }


    try {

        const response =
            await fetch(
                SOUND_FILE
            );


        if (!response.ok) {

            throw new Error(
                "音声ファイルを読み込めません"
            );

        }


        const arrayBuffer =
            await response.arrayBuffer();


        const ctx =
            getAudioContext();


        audioBuffer =
            await ctx.decodeAudioData(
                arrayBuffer
            );


        return true;

    }

    catch (error) {

        console.error(error);

        status.textContent =
            "音声ファイルを確認してください";

        return false;

    }

}


/* ==========================================
   ホーン開始
========================================== */

async function startHorn() {

    if (isPressed) {

        return;

    }


    isPressed = true;


    button.classList.add(
        "pressed"
    );


    status.classList.add(
        "playing"
    );

    status.textContent =
        "● 吹鳴中";


    const ctx =
        getAudioContext();


    /*
        iPhone / iPadなどで
        AudioContextが停止状態の場合
        ここで復帰
    */

    if (
        ctx.state ===
        "suspended"
    ) {

        await ctx.resume();

    }


    /*
        音声がまだ読み込まれていない場合
        読み込む
    */

    const loaded =
        await loadSound();


    if (!loaded) {

        stopHorn();

        return;

    }


    /*
        念のため既存音声を停止
    */

    if (sourceNode) {

        try {

            sourceNode.stop();

        }

        catch (e) {}

    }


    /*
        新しい再生ノード
    */

    sourceNode =
        ctx.createBufferSource();


    sourceNode.buffer =
        audioBuffer;


    sourceNode.connect(
        ctx.destination
    );


    /*
        即時再生
    */

    sourceNode.start(
        0
    );

}


/* ==========================================
   ホーン停止
========================================== */

function stopHorn() {

    if (!isPressed) {

        return;

    }


    isPressed = false;


    /*
        音声停止
    */

    if (sourceNode) {

        try {

            sourceNode.stop();

        }

        catch (e) {}

        sourceNode = null;

    }


    /*
        UI
    */

    button.classList.remove(
        "pressed"
    );


    status.classList.remove(
        "playing"
    );

    status.textContent =
        "READY";

}


/* ==========================================
   マウス
========================================== */

button.addEventListener(
    "mousedown",
    event => {

        event.preventDefault();

        startHorn();

    }
);


button.addEventListener(
    "mouseup",
    event => {

        event.preventDefault();

        stopHorn();

    }
);


button.addEventListener(
    "mouseleave",
    () => {

        stopHorn();

    }
);


/* ==========================================
   タッチ
========================================== */

button.addEventListener(
    "touchstart",
    event => {

        event.preventDefault();

        startHorn();

    },
    {
        passive: false
    }
);


button.addEventListener(
    "touchend",
    event => {

        event.preventDefault();

        stopHorn();

    },
    {
        passive: false
    }
);


button.addEventListener(
    "touchcancel",
    event => {

        event.preventDefault();

        stopHorn();

    },
    {
        passive: false
    }
);


/* ==========================================
   ウィンドウからフォーカスが外れた
========================================== */

window.addEventListener(
    "blur",
    () => {

        stopHorn();

    }
);


/* ==========================================
   スペースキー
========================================== */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.code !== "Space"
        ) {

            return;

        }


        if (
            event.repeat
        ) {

            return;

        }


        event.preventDefault();

        startHorn();

    }
);


document.addEventListener(
    "keyup",
    event => {

        if (
            event.code !== "Space"
        ) {

            return;

        }


        event.preventDefault();

        stopHorn();

    }
);

</script>


</body>
</html>
